<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1219" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Pravěký kyj</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0d1219;
    font-family:"Courier New",ui-monospace,monospace;
    color:#f2e8d5;
    display:flex;flex-direction:column;align-items:center;
    touch-action:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{position:relative;width:100%;max-width:1200px;height:100%;display:flex;flex-direction:column}
  #stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:4px}
  #frame{position:relative;line-height:0}
  canvas{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px}
  #sysbtns{position:absolute;top:6px;right:6px;display:flex;gap:6px;z-index:3}
  .sys{
    width:34px;height:34px;border-radius:8px;background:rgba(12,18,26,.72);
    border:2px solid #46566e;color:#f2e8d5;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer
  }
  .sys:active{background:#1f6f5c}

  .overlay{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;
    background:rgba(8,11,16,.86);padding:16px
  }
  .overlay.show{display:flex}
  .overlay h1{font-size:clamp(22px,6vw,40px);letter-spacing:2px;color:#ffcf5c;text-shadow:3px 3px 0 #000}
  .overlay h2{font-size:clamp(18px,5vw,30px);color:#ff7a4d;text-shadow:3px 3px 0 #000}
  .overlay p{font-size:clamp(12px,3.2vw,16px);line-height:1.6;color:#cdbfa6;max-width:34ch}
  .big{
    padding:12px 26px;font:bold clamp(15px,4vw,20px)/1 "Courier New",monospace;
    background:#1f6f5c;border:3px solid #f2e8d5;color:#fff;border-radius:10px;cursor:pointer
  }
  .big:active{background:#2a9179;transform:translateY(2px)}

  #pad{
    flex:0 0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:10px 14px;background:#141a24;border-top:2px solid #26303f
  }
  /* na šířku: tlačítka plavou přes spodek plátna, ať se vejde všechno */
  @media (orientation:landscape) and (max-height:620px){
    #stage{padding:0}
    #pad{
      position:absolute;left:0;right:0;bottom:0;z-index:5;
      background:transparent;border-top:none;pointer-events:none;
      padding:0 18px calc(12px + env(safe-area-inset-bottom))
    }
    #pad .grp{pointer-events:auto}
    .btn{width:clamp(52px,11vw,66px);height:clamp(52px,11vw,66px);opacity:.9;box-shadow:0 3px 10px rgba(0,0,0,.5)}
  }
  .grp{display:flex;gap:10px}
  .btn{
    width:clamp(58px,17vw,74px);height:clamp(58px,17vw,74px);border-radius:14px;
    background:#232d3c;border:2px solid #3b4b63;color:#e8dcc6;
    font-size:clamp(22px,6vw,28px);display:flex;align-items:center;justify-content:center;
    touch-action:none;cursor:pointer
  }
  .btn:active,.btn.on{background:#1f6f5c;border-color:#38c9a3;transform:scale(.94)}
  .hit{background:#7a2f26;border-color:#c0442f}
  .hit:active,.hit.on{background:#d2691e;border-color:#ffb347}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
   <div id="frame">
    <canvas id="c" width="800" height="400"></canvas>
    <div id="sysbtns">
      <div class="sys" id="bFull">⛶</div>
      <div class="sys" id="bSound">♪</div>
      <div class="sys" id="bPause">❚❚</div>
    </div>

    <div class="overlay show" id="ovStart">
      <h1>PRAVĚKÝ KYJ</h1>
      <p>Šipky nebo tlačítka: chůze a skok. Kyjem mlátíš dinosaury a palmy. Skok na hlavu taky funguje.</p>
      <button class="big" id="bStart">Začít hru</button>
    </div>

    <div class="overlay" id="ovPause">
      <h2>PAUZA</h2>
      <button class="big" id="bResume">Pokračovat</button>
    </div>

    <div class="overlay" id="ovClear">
      <h2 id="clearTitle">ÚROVEŇ SPLNĚNA</h2>
      <p id="clearInfo"></p>
      <button class="big" id="bNext">Další úroveň</button>
    </div>

    <div class="overlay" id="ovOver">
      <h2>KONEC HRY</h2>
      <p id="overInfo"></p>
      <button class="big" id="bRetry">Hrát znovu</button>
    </div>
   </div>
  </div>

  <div id="pad">
    <div class="grp">
      <div class="btn" id="bLeft" data-k="left">◀</div>
      <div class="btn" id="bRight" data-k="right">▶</div>
    </div>
    <div class="grp">
      <div class="btn hit" id="bAtk" data-k="atk">🔨</div>
      <div class="btn hit" id="bJump" data-k="up">▲</div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------------- základ ---------------- */
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = cvs.width, H = cvs.height;

const GRAV = 0.62, MAXFALL = 15;
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);

/* ---------------- zvuk ---------------- */
const Snd = {
  ac:null, on:true,
  init(){ try{
    if(!this.ac) this.ac = new (window.AudioContext||window.webkitAudioContext)();
    if(this.ac.state === "suspended") this.ac.resume();
  }catch(e){} },
  tone(f1,f2,dur,type,vol){
    if(!this.on || !this.ac) return;
    const t0 = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type||"square";
    o.frequency.setValueAtTime(f1,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), t0+dur);
    g.gain.setValueAtTime(vol||.06,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ac.destination);
    o.start(t0); o.stop(t0+dur+.03);
  },
  noise(dur,vol){
    if(!this.on || !this.ac) return;
    const ac = this.ac, n = Math.floor(ac.sampleRate*dur);
    const b = ac.createBuffer(1,n,ac.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const s = ac.createBufferSource(); s.buffer = b;
    const g = ac.createGain(); g.gain.value = vol||.08;
    s.connect(g); g.connect(ac.destination); s.start();
  },
  jump(){ this.tone(300,660,.14,"square",.05); },
  swing(){ this.noise(.08,.05); },
  hit(){ this.noise(.13,.10); this.tone(180,60,.14,"sawtooth",.05); },
  stomp(){ this.tone(520,130,.12,"square",.06); },
  coin(){ this.tone(680,0,.07,"triangle",.07); setTimeout(()=>this.tone(1020,0,.11,"triangle",.06),70); },
  hurt(){ this.tone(330,80,.35,"sawtooth",.07); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0,.16,"triangle",.07), i*110)); },
  over(){ [392,311,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,0,.3,"sawtooth",.06), i*170)); }
};

/* ---------------- stav ---------------- */
let state = "start";           // start | play | pause | clear | over | win
let score = 0, lives = 3, levelIdx = 0, levelTime = 0, best = 0;
let cam = { x:0, shake:0 };
let tick = 0;
let particles = [], floats = [];
let level = null;

const keys = { left:false, right:false, up:false, atk:false };
let upPrev = false;

const player = {
  x:60, y:200, vx:0, vy:0, w:34, h:50,
  speed:4.4, jump:-12.3, grounded:false, facing:1,
  atk:0, atkCd:0, walk:0, coyote:0, buffer:0, inv:0,
  ride:null, blink:0, squash:1, safeX:60, safeY:200
};

/* ---------------- data úrovní ---------------- */
// g = pevná zem, r = skalní plošina (dá se proskočit zdola)
const G = (x,w) => ({ x, y:340, w, h:70, solid:true, kind:"ground" });
const R = (x,y,w,move=null) => ({ x, y, w, h:20, solid:false, kind:"rock", move, ox:x, oy:y, dx:0, dy:0 });
const E = (type,x,minX,maxX,sp,y) => ({ type, x, y, minX, maxX, vx:sp, dead:0, ph:Math.random()*6, w:type==="ptero"?46:(type==="plant"?30:48), h:type==="ptero"?30:(type==="plant"?40:46) });
const I = (x,y,type) => ({ x, y, w:26, h:24, type, got:false, ph:Math.random()*6 });
const T = (x) => ({ x, y:140, hit:false, sh:0 });

const LEVELS = [
  {
    name:"Zelené údolí", width:3100, goal:2930,
    sky:["#63a7e8","#bfe0f5"], hill:"#2f6b4a", far:"#33587d", fog:"#a9cfe8",
    ground:[ G(-200,1120), G(1050,760), G(1900,1400) ],
    rocks:[ R(250,262,140), R(460,200,120), R(680,252,150), R(880,190,120),
            R(1120,258,130), R(1330,196,120), R(1560,250,140),
            R(1960,252,150), R(2200,190,130), R(2440,250,150), R(2680,196,140) ],
    trees:[ T(130), T(760), T(1420), T(2060), T(2600) ],
    items:[ I(300,222,"meat"), I(500,160,"fruit"), I(730,212,"meat"),
            I(1160,218,"fruit"), I(1600,210,"meat"), I(2240,150,"egg"),
            I(2480,210,"fruit"), I(2720,156,"meat") ],
    enemies:[ E("dino",380,240,820,1.7,294), E("dino",1250,1080,1700,-1.9,294),
              E("dino",2150,1950,2500,2.0,294), E("dino",2700,2560,3000,-2.2,294) ]
  },
  {
    name:"Sopečná stezka", width:3400, goal:3230,
    sky:["#e0762f","#f7c26b"], hill:"#5a3524", far:"#7a3b23", fog:"#f0b177",
    ground:[ G(-200,900), G(960,520), G(1620,600), G(2360,1300) ],
    rocks:[ R(230,255,130), R(430,190,110), R(640,250,120),
            R(830,230,110, {axis:"x",range:120,sp:.018}),
            R(1120,250,120), R(1350,190,120),
            R(1560,235,110, {axis:"y",range:70,sp:.02}),
            R(1780,250,140), R(2000,192,120),
            R(2180,240,120, {axis:"x",range:140,sp:.016}),
            R(2440,250,140), R(2680,188,130), R(2920,246,150) ],
    trees:[ T(120), T(1180), T(1900), T(2760) ],
    items:[ I(270,215,"meat"), I(470,150,"fruit"), I(870,190,"egg"),
            I(1390,150,"meat"), I(1820,210,"fruit"), I(2230,200,"meat"),
            I(2720,148,"egg"), I(2960,206,"fruit") ],
    enemies:[ E("dino",350,220,760,2.0,294), E("ptero",700,600,1100,1.9,170),
              E("plant",1180,0,0,0,300), E("dino",1750,1640,2100,-2.1,294),
              E("ptero",2050,1900,2400,2.2,150), E("dino",2600,2400,2950,2.2,294),
              E("plant",3050,0,0,0,300) ]
  },
  {
    name:"Rokle předků", width:3700, goal:3520,
    sky:["#3a2a5e","#8b6fb0"], hill:"#2a2140", far:"#3d2f63", fog:"#9d86c4",
    ground:[ G(-200,760), G(880,420), G(1420,360), G(1900,420), G(2450,1500) ],
    rocks:[ R(210,250,120), R(400,188,110), R(600,246,110),
            R(760,225,100, {axis:"x",range:150,sp:.019}),
            R(1050,240,110), R(1300,190,110),
            R(1330,250,100, {axis:"y",range:80,sp:.022}),
            R(1620,238,110), R(1810,186,110),
            R(2080,244,120), R(2280,196,110),
            R(2330,250,110, {axis:"x",range:160,sp:.017}),
            R(2620,240,130), R(2860,186,120), R(3080,244,140), R(3300,190,130) ],
    trees:[ T(100), T(980), T(2160), T(3000) ],
    items:[ I(250,208,"meat"), I(430,146,"fruit"), I(800,182,"egg"),
            I(1340,148,"meat"), I(1850,146,"fruit"), I(2320,154,"egg"),
            I(2900,144,"meat"), I(3120,202,"fruit"), I(3340,148,"egg") ],
    enemies:[ E("dino",320,200,700,2.2,294), E("ptero",620,520,1000,2.2,160),
              E("plant",1000,0,0,0,300), E("ptero",1500,1350,1850,-2.4,140),
              E("dino",2000,1910,2280,2.3,294), E("plant",2500,0,0,0,300),
              E("ptero",2700,2550,3050,2.5,150), E("dino",2900,2700,3200,-2.4,294),
              E("dino",3350,3200,3600,2.5,294) ]
  }
];

function loadLevel(i){
  const L = LEVELS[i];
  level = {
    def:L, width:L.width, goal:L.goal,
    platforms: L.ground.map(g=>({...g})).concat(L.rocks.map(r=>({...r, move:r.move?{...r.move}:null}))),
    trees: L.trees.map(t=>({...t})),
    items: L.items.map(o=>({...o})),
    enemies: L.enemies.map(e=>({...e})),
    clouds: Array.from({length:9},(_,k)=>({ x:k*380+rnd(-60,60), y:rnd(30,130), s:rnd(.6,1.3) }))
  };
  Object.assign(player,{ x:60, y:220, vx:0, vy:0, grounded:false, facing:1,
    atk:0, atkCd:0, inv:60, ride:null, safeX:60, safeY:220 });
  particles = []; floats = []; levelTime = 0; cam.x = 0; cam.shake = 0;
}

/* ---------------- efekty ---------------- */
function burst(x,y,n,col,pw=3){
  for(let i=0;i<n;i++) particles.push({
    x, y, vx:rnd(-pw,pw), vy:rnd(-pw,1), life:rnd(18,38), max:38,
    c:col, s:rnd(2,4), g:.22
  });
}
function float(x,y,txt,col="#ffcf5c"){ floats.push({x,y,txt,col,life:52}); }
function shake(v){ cam.shake = Math.max(cam.shake,v); }

/* ---------------- ovládání ---------------- */
document.querySelectorAll("#pad .btn").forEach(b=>{
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); keys[k]=true;  b.classList.add("on"); Snd.init(); };
  const off = e => { e.preventDefault(); keys[k]=false; b.classList.remove("on"); };
  b.addEventListener("pointerdown",on);
  b.addEventListener("pointerup",off);
  b.addEventListener("pointercancel",off);
  b.addEventListener("pointerleave",off);
  b.addEventListener("contextmenu",e=>e.preventDefault());
});
addEventListener("keydown",e=>{
  const c = e.code;
  if(c==="ArrowLeft"||c==="KeyA") keys.left=true;
  if(c==="ArrowRight"||c==="KeyD") keys.right=true;
  if(c==="ArrowUp"||c==="KeyW"||c==="Space"){ keys.up=true; e.preventDefault(); }
  if(c==="KeyF"||c==="KeyE"||c==="ShiftLeft") keys.atk=true;
  if(c==="KeyP"||c==="Escape") togglePause();
  if(c==="KeyM") toggleSound();
});
addEventListener("keyup",e=>{
  const c = e.code;
  if(c==="ArrowLeft"||c==="KeyA") keys.left=false;
  if(c==="ArrowRight"||c==="KeyD") keys.right=false;
  if(c==="ArrowUp"||c==="KeyW"||c==="Space") keys.up=false;
  if(c==="KeyF"||c==="KeyE"||c==="ShiftLeft") keys.atk=false;
});

const ov = {
  start:document.getElementById("ovStart"),
  pause:document.getElementById("ovPause"),
  clear:document.getElementById("ovClear"),
  over:document.getElementById("ovOver")
};
const show = n => { for(const k in ov) ov[k].classList.toggle("show", k===n); };

document.getElementById("bStart").onclick = () => { Snd.init(); score=0; lives=3; levelIdx=0; loadLevel(0); state="play"; show(null); };
document.getElementById("bResume").onclick = () => { state="play"; show(null); };
document.getElementById("bRetry").onclick = () => { Snd.init(); score=0; lives=3; levelIdx=0; loadLevel(0); state="play"; show(null); };
document.getElementById("bNext").onclick = () => {
  levelIdx++;
  if(levelIdx >= LEVELS.length){ score=0; lives=3; levelIdx=0; }
  loadLevel(levelIdx); state="play"; show(null);
};
document.getElementById("bPause").onclick = togglePause;
document.getElementById("bSound").onclick = toggleSound;

/* ---------------- přizpůsobení obrazovce ---------------- */
const stageEl = document.getElementById("stage");
const frameEl = document.getElementById("frame");
const appEl = document.getElementById("app");
function fit(){
  // Chrome na Androidu počítá do 100% i plochu pod adresním řádkem – bereme reálnou výšku
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  appEl.style.height = vh + "px";
  const r = stageEl.getBoundingClientRect();
  const s = Math.min(r.width/W, r.height/H);
  const w = Math.max(200, Math.floor(W*s)), h = Math.floor(H*s);
  cvs.style.width = w+"px";  cvs.style.height = h+"px";
  frameEl.style.width = w+"px"; frameEl.style.height = h+"px";
}
addEventListener("resize", fit);
addEventListener("orientationchange", () => { setTimeout(fit,120); setTimeout(fit,450); });
if(window.visualViewport){
  visualViewport.addEventListener("resize", fit);
  visualViewport.addEventListener("scroll", fit);
}
fit();

const fullBtn = document.getElementById("bFull");
const canFull = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if(!canFull) fullBtn.style.display = "none";   // iPhone Safari fullscreen API nemá
fullBtn.onclick = () => {
  const el = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  setTimeout(fit, 300);
};

function togglePause(){
  if(state==="play"){ state="pause"; show("pause"); }
  else if(state==="pause"){ state="play"; show(null); }
}
function toggleSound(){
  Snd.on = !Snd.on;
  document.getElementById("bSound").textContent = Snd.on ? "♪" : "✕";
}

/* ---------------- logika ---------------- */
function update(dt){
  tick += dt;
  if(state !== "play") return;
  levelTime += dt/60;

  // pohyblivé plošiny
  for(const p of level.platforms){
    if(!p.move) continue;
    const nx = p.move.axis==="x" ? p.ox + Math.sin(tick*p.move.sp)*p.move.range : p.ox;
    const ny = p.move.axis==="y" ? p.oy + Math.sin(tick*p.move.sp)*p.move.range : p.oy;
    p.dx = nx-p.x; p.dy = ny-p.y; p.x = nx; p.y = ny;
  }

  // časovače
  player.inv    = Math.max(0, player.inv-dt);
  player.atk    = Math.max(0, player.atk-dt);
  player.atkCd  = Math.max(0, player.atkCd-dt);
  player.coyote = Math.max(0, player.coyote-dt);
  player.buffer = Math.max(0, player.buffer-dt);
  player.squash += (1-player.squash)*.18*dt;

  // horizontální vstup
  const want = (keys.right?1:0) - (keys.left?1:0);
  if(want){
    player.vx += (want*player.speed - player.vx)*.28*dt;
    player.facing = want;
    player.walk += .22*dt;
  } else {
    player.vx *= Math.pow(.78, dt);
    if(Math.abs(player.vx) < .1) player.vx = 0;
  }

  // skok (buffer + coyote + proměnná výška)
  if(keys.up && !upPrev) player.buffer = 9;
  upPrev = keys.up;
  if(player.buffer>0 && (player.grounded || player.coyote>0)){
    player.vy = player.jump; player.grounded=false; player.coyote=0; player.buffer=0;
    player.ride=null; player.squash=1.35; Snd.jump();
    burst(player.x+player.w/2, player.y+player.h, 6, "#d9c9a3", 2);
  }
  if(!keys.up && player.vy < -4) player.vy = -4;

  // úder kyjem
  if(keys.atk && player.atkCd<=0){
    player.atk = 16; player.atkCd = 26; Snd.swing();
    const hx = player.facing===1 ? player.x+player.w-6 : player.x-44;
    const hb = { x:hx, y:player.y-6, w:52, h:54 };
    for(const en of level.enemies){
      if(en.dead || en.type==="plant") continue;
      if(hb.x < en.x+en.w && hb.x+hb.w > en.x && hb.y < en.y+en.h && hb.y+hb.h > en.y){
        en.dead = 1; score += 200; Snd.hit(); shake(7);
        burst(en.x+en.w/2, en.y+en.h/2, 16, "#b06fd8", 4);
        float(en.x+en.w/2, en.y, "+200");
      }
    }
    for(const tr of level.trees){
      if(tr.hit) continue;
      if(hb.x < tr.x+80 && hb.x+hb.w > tr.x-10 && hb.y < tr.y+210 && hb.y+hb.h > tr.y){
        tr.hit = true; tr.sh = 16; score += 100; Snd.hit(); shake(4);
