<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1219" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Pravěký kyj</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:#0d1219;
    font-family:"Courier New",ui-monospace,monospace;
    color:#f2e8d5;
    display:flex;flex-direction:column;align-items:center;
    touch-action:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{position:relative;width:100%;max-width:1200px;height:100%;display:flex;flex-direction:column}
  #stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:4px}
  #frame{position:relative;line-height:0}
  canvas{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px}
  #sysbtns{position:absolute;top:6px;right:6px;display:flex;gap:6px;z-index:3}
  .sys{
    width:34px;height:34px;border-radius:8px;background:rgba(12,18,26,.72);
    border:2px solid #46566e;color:#f2e8d5;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer
  }
  .sys:active{background:#1f6f5c}

  .overlay{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;
    background:rgba(8,11,16,.86);padding:16px
  }
  .overlay.show{display:flex}
  .overlay h1{font-size:clamp(22px,6vw,40px);letter-spacing:2px;color:#ffcf5c;text-shadow:3px 3px 0 #000}
  .overlay h2{font-size:clamp(18px,5vw,30px);color:#ff7a4d;text-shadow:3px 3px 0 #000}
  .overlay p{font-size:clamp(12px,3.2vw,16px);line-height:1.6;color:#cdbfa6;max-width:34ch}
  .big{
    padding:12px 26px;font:bold clamp(15px,4vw,20px)/1 "Courier New",monospace;
    background:#1f6f5c;border:3px solid #f2e8d5;color:#fff;border-radius:10px;cursor:pointer
  }
  .big:active{background:#2a9179;transform:translateY(2px)}

  #pad{
    flex:0 0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:10px 14px;background:#141a24;border-top:2px solid #26303f
  }
  /* na šířku: tlačítka plavou přes spodek plátna, ať se vejde všechno */
  @media (orientation:landscape) and (max-height:620px){
    #stage{padding:0}
    #pad{
      position:absolute;left:0;right:0;bottom:0;z-index:5;
      background:transparent;border-top:none;pointer-events:none;
      padding:0 18px calc(12px + env(safe-area-inset-bottom))
    }
    #pad .grp{pointer-events:auto}
    .btn{width:clamp(52px,11vw,66px);height:clamp(52px,11vw,66px);opacity:.9;box-shadow:0 3px 10px rgba(0,0,0,.5)}
  }
  .grp{display:flex;gap:10px}
  .btn{
    width:clamp(58px,17vw,74px);height:clamp(58px,17vw,74px);border-radius:14px;
    background:#232d3c;border:2px solid #3b4b63;color:#e8dcc6;
    font-size:clamp(22px,6vw,28px);display:flex;align-items:center;justify-content:center;
    touch-action:none;cursor:pointer
  }
  .btn:active,.btn.on{background:#1f6f5c;border-color:#38c9a3;transform:scale(.94)}
  .hit{background:#7a2f26;border-color:#c0442f}
  .hit:active,.hit.on{background:#d2691e;border-color:#ffb347}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
   <div id="frame">
    <canvas id="c" width="800" height="400"></canvas>
    <div id="sysbtns">
      <div class="sys" id="bFull">⛶</div>
      <div class="sys" id="bSound">♪</div>
      <div class="sys" id="bPause">❚❚</div>
    </div>

    <div class="overlay show" id="ovStart">
      <h1>PRAVĚKÝ KYJ</h1>
      <p>Šipky nebo tlačítka: chůze a skok. Kyjem mlátíš dinosaury a palmy. Skok na hlavu taky funguje.</p>
      <button class="big" id="bStart">Začít hru</button>
    </div>

    <div class="overlay" id="ovPause">
      <h2>PAUZA</h2>
      <button class="big" id="bResume">Pokračovat</button>
    </div>

    <div class="overlay" id="ovClear">
      <h2 id="clearTitle">ÚROVEŇ SPLNĚNA</h2>
      <p id="clearInfo"></p>
      <button class="big" id="bNext">Další úroveň</button>
    </div>

    <div class="overlay" id="ovOver">
      <h2>KONEC HRY</h2>
      <p id="overInfo"></p>
      <button class="big" id="bRetry">Hrát znovu</button>
    </div>
   </div>
  </div>

  <div id="pad">
    <div class="grp">
      <div class="btn" id="bLeft" data-k="left">◀</div>
      <div class="btn" id="bRight" data-k="right">▶</div>
    </div>
    <div class="grp">
      <div class="btn hit" id="bAtk" data-k="atk">🔨</div>
      <div class="btn hit" id="bJump" data-k="up">▲</div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------------- základ ---------------- */
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = cvs.width, H = cvs.height;

const GRAV = 0.62, MAXFALL = 15;
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);

/* ---------------- zvuk ---------------- */
const Snd = {
  ac:null, on:true,
  init(){ try{
    if(!this.ac) this.ac = new (window.AudioContext||window.webkitAudioContext)();
    if(this.ac.state === "suspended") this.ac.resume();
  }catch(e){} },
  tone(f1,f2,dur,type,vol){
    if(!this.on || !this.ac) return;
    const t0 = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type||"square";
    o.frequency.setValueAtTime(f1,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), t0+dur);
    g.gain.setValueAtTime(vol||.06,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ac.destination);
    o.start(t0); o.stop(t0+dur+.03);
  },
  noise(dur,vol){
    if(!this.on || !this.ac) return;
    const ac = this.ac, n = Math.floor(ac.sampleRate*dur);
    const b = ac.createBuffer(1,n,ac.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const s = ac.createBufferSource(); s.buffer = b;
    const g = ac.createGain(); g.gain.value = vol||.08;
    s.connect(g); g.connect(ac.destination); s.start();
  },
  jump(){ this.tone(300,660,.14,"square",.05); },
  swing(){ this.noise(.08,.05); },
  hit(){ this.noise(.13,.10); this.tone(180,60,.14,"sawtooth",.05); },
  stomp(){ this.tone(520,130,.12,"square",.06); },
  coin(){ this.tone(680,0,.07,"triangle",.07); setTimeout(()=>this.tone(1020,0,.11,"triangle",.06),70); },
  hurt(){ this.tone(330,80,.35,"sawtooth",.07); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0,.16,"triangle",.07), i*110)); },
  over(){ [392,311,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,0,.3,"sawtooth",.06), i*170)); }
};

/* ---------------- stav ---------------- */
let state = "start";           // start | play | pause | clear | over | win
let score = 0, lives = 3, levelIdx = 0, levelTime = 0, best = 0;
let cam = { x:0, shake:0 };
let tick = 0;
let particles = [], floats = [];
let level = null;

const keys = { left:false, right:false, up:false, atk:false };
let upPrev = false;

const player = {
  x:60, y:200, vx:0, vy:0, w:34, h:50,
  speed:4.4, jump:-12.3, grounded:false, facing:1,
  atk:0, atkCd:0, walk:0, coyote:0, buffer:0, inv:0,
  ride:null, blink:0, squash:1, safeX:60, safeY:200
};

/* ---------------- data úrovní ---------------- */
// g = pevná zem, r = skalní plošina (dá se proskočit zdola)
const G = (x,w) => ({ x, y:340, w, h:70, solid:true, kind:"ground" });
const R = (x,y,w,move=null) => ({ x, y, w, h:20, solid:false, kind:"rock", move, ox:x, oy:y, dx:0, dy:0 });
const E = (type,x,minX,maxX,sp,y) => ({ type, x, y, minX, maxX, vx:sp, dead:0, ph:Math.random()*6, w:type==="ptero"?46:(type==="plant"?30:48), h:type==="ptero"?30:(type==="plant"?40:46) });
const I = (x,y,type) => ({ x, y, w:26, h:24, type, got:false, ph:Math.random()*6 });
const T = (x) => ({ x, y:140, hit:false, sh:0 });

const LEVELS = [
  {
    name:"Zelené údolí", width:3100, goal:2930,
    sky:["#63a7e8","#bfe0f5"], hill:"#2f6b4a", far:"#33587d", fog:"#a9cfe8",
    ground:[ G(-200,1120), G(1050,760), G(1900,1400) ],
    rocks:[ R(250,262,140), R(460,200,120), R(680,252,150), R(880,190,120),
            R(1120,258,130), R(1330,196,120), R(1560,250,140),
            R(1960,252,150), R(2200,190,130), R(2440,250,150), R(2680,196,140) ],
    trees:[ T(130), T(760), T(1420), T(2060), T(2600) ],
    items:[ I(300,222,"meat"), I(500,160,"fruit"), I(730,212,"meat"),
            I(1160,218,"fruit"), I(1600,210,"meat"), I(2240,150,"egg"),
            I(2480,210,"fruit"), I(2720,156,"meat") ],
    enemies:[ E("dino",380,240,820,1.7,294), E("dino",1250,1080,1700,-1.9,294),
              E("dino",2150,1950,2500,2.0,294), E("dino",2700,2560,3000,-2.2,294) ]
  },
  {
    name:"Sopečná stezka", width:3400, goal:3230,
    sky:["#e0762f","#f7c26b"], hill:"#5a3524", far:"#7a3b23", fog:"#f0b177",
    ground:[ G(-200,900), G(960,520), G(1620,600), G(2360,1300) ],
    rocks:[ R(230,255,130), R(430,190,110), R(640,250,120),
            R(830,230,110, {axis:"x",range:120,sp:.018}),
            R(1120,250,120), R(1350,190,120),
            R(1560,235,110, {axis:"y",range:70,sp:.02}),
            R(1780,250,140), R(2000,192,120),
            R(2180,240,120, {axis:"x",range:140,sp:.016}),
            R(2440,250,140), R(2680,188,130), R(2920,246,150) ],
    trees:[ T(120), T(1180), T(1900), T(2760) ],
    items:[ I(270,215,"meat"), I(470,150,"fruit"), I(870,190,"egg"),
            I(1390,150,"meat"), I(1820,210,"fruit"), I(2230,200,"meat"),
            I(2720,148,"egg"), I(2960,206,"fruit") ],
    enemies:[ E("dino",350,220,760,2.0,294), E("ptero",700,600,1100,1.9,170),
              E("plant",1180,0,0,0,300), E("dino",1750,1640,2100,-2.1,294),
              E("ptero",2050,1900,2400,2.2,150), E("dino",2600,2400,2950,2.2,294),
              E("plant",3050,0,0,0,300) ]
  },
  {
    name:"Rokle předků", width:3700, goal:3520,
    sky:["#3a2a5e","#8b6fb0"], hill:"#2a2140", far:"#3d2f63", fog:"#9d86c4",
    ground:[ G(-200,760), G(880,420), G(1420,360), G(1900,420), G(2450,1500) ],
    rocks:[ R(210,250,120), R(400,188,110), R(600,246,110),
            R(760,225,100, {axis:"x",range:150,sp:.019}),
            R(1050,240,110), R(1300,190,110),
            R(1330,250,100, {axis:"y",range:80,sp:.022}),
            R(1620,238,110), R(1810,186,110),
            R(2080,244,120), R(2280,196,110),
            R(2330,250,110, {axis:"x",range:160,sp:.017}),
            R(2620,240,130), R(2860,186,120), R(3080,244,140), R(3300,190,130) ],
    trees:[ T(100), T(980), T(2160), T(3000) ],
    items:[ I(250,208,"meat"), I(430,146,"fruit"), I(800,182,"egg"),
            I(1340,148,"meat"), I(1850,146,"fruit"), I(2320,154,"egg"),
            I(2900,144,"meat"), I(3120,202,"fruit"), I(3340,148,"egg") ],
    enemies:[ E("dino",320,200,700,2.2,294), E("ptero",620,520,1000,2.2,160),
              E("plant",1000,0,0,0,300), E("ptero",1500,1350,1850,-2.4,140),
              E("dino",2000,1910,2280,2.3,294), E("plant",2500,0,0,0,300),
              E("ptero",2700,2550,3050,2.5,150), E("dino",2900,2700,3200,-2.4,294),
              E("dino",3350,3200,3600,2.5,294) ]
  }
];

function loadLevel(i){
  const L = LEVELS[i];
  level = {
    def:L, width:L.width, goal:L.goal,
    platforms: L.ground.map(g=>({...g})).concat(L.rocks.map(r=>({...r, move:r.move?{...r.move}:null}))),
    trees: L.trees.map(t=>({...t})),
    items: L.items.map(o=>({...o})),
    enemies: L.enemies.map(e=>({...e})),
    clouds: Array.from({length:9},(_,k)=>({ x:k*380+rnd(-60,60), y:rnd(30,130), s:rnd(.6,1.3) }))
  };
  Object.assign(player,{ x:60, y:220, vx:0, vy:0, grounded:false, facing:1,
    atk:0, atkCd:0, inv:60, ride:null, safeX:60, safeY:220 });
  particles = []; floats = []; levelTime = 0; cam.x = 0; cam.shake = 0;
}

/* ---------------- efekty ---------------- */
function burst(x,y,n,col,pw=3){
  for(let i=0;i<n;i++) particles.push({
    x, y, vx:rnd(-pw,pw), vy:rnd(-pw,1), life:rnd(18,38), max:38,
    c:col, s:rnd(2,4), g:.22
  });
}
function float(x,y,txt,col="#ffcf5c"){ floats.push({x,y,txt,col,life:52}); }
function shake(v){ cam.shake = Math.max(cam.shake,v); }

/* ---------------- ovládání ---------------- */
document.querySelectorAll("#pad .btn").forEach(b=>{
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); keys[k]=true;  b.classList.add("on"); Snd.init(); };
  const off = e => { e.preventDefault(); keys[k]=false; b.classList.remove("on"); };
  b.addEventListener("pointerdown",on);
  b.addEventListener("pointerup",off);
  b.addEventListener("pointercancel",off);
  b.addEventListener("pointerleave",off);
  b.addEventListener("contextmenu",e=>e.preventDefault());
});
addEventListener("keydown",e=>{
  const c = e.code;
  if(c==="ArrowLeft"||c==="KeyA") keys.left=true;
  if(c==="ArrowRight"||c==="KeyD") keys.right=true;
  if(c==="ArrowUp"||c==="KeyW"||c==="Space"){ keys.up=true; e.preventDefault(); }
  if(c==="KeyF"||c==="KeyE"||c==="ShiftLeft") keys.atk=true;
  if(c==="KeyP"||c==="Escape") togglePause();
  if(c==="KeyM") toggleSound();
});
addEventListener("keyup",e=>{
  const c = e.code;
  if(c==="ArrowLeft"||c==="KeyA") keys.left=false;
  if(c==="ArrowRight"||c==="KeyD") keys.right=false;
  if(c==="ArrowUp"||c==="KeyW"||c==="Space") keys.up=false;
  if(c==="KeyF"||c==="KeyE"||c==="ShiftLeft") keys.atk=false;
});

const ov = {
  start:document.getElementById("ovStart"),
  pause:document.getElementById("ovPause"),
  clear:document.getElementById("ovClear"),
  over:document.getElementById("ovOver")
};
const show = n => { for(const k in ov) ov[k].classList.toggle("show", k===n); };

document.getElementById("bStart").onclick = () => { Snd.init(); score=0; lives=3; levelIdx=0; loadLevel(0); state="play"; show(null); };
document.getElementById("bResume").onclick = () => { state="play"; show(null); };
document.getElementById("bRetry").onclick = () => { Snd.init(); score=0; lives=3; levelIdx=0; loadLevel(0); state="play"; show(null); };
document.getElementById("bNext").onclick = () => {
  levelIdx++;
  if(levelIdx >= LEVELS.length){ score=0; lives=3; levelIdx=0; }
  loadLevel(levelIdx); state="play"; show(null);
};
document.getElementById("bPause").onclick = togglePause;
document.getElementById("bSound").onclick = toggleSound;

/* ---------------- přizpůsobení obrazovce ---------------- */
const stageEl = document.getElementById("stage");
const frameEl = document.getElementById("frame");
function fit(){
  const r = stageEl.getBoundingClientRect();
  const s = Math.min(r.width/W, r.height/H);
  const w = Math.max(200, Math.floor(W*s)), h = Math.floor(H*s);
  cvs.style.width = w+"px";  cvs.style.height = h+"px";
  frameEl.style.width = w+"px"; frameEl.style.height = h+"px";
}
addEventListener("resize", fit);
addEventListener("orientationchange", () => setTimeout(fit, 250));
if(window.visualViewport) visualViewport.addEventListener("resize", fit);
fit();

const fullBtn = document.getElementById("bFull");
const canFull = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if(!canFull) fullBtn.style.display = "none";   // iPhone Safari fullscreen API nemá
fullBtn.onclick = () => {
  const el = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  setTimeout(fit, 300);
};

function togglePause(){
  if(state==="play"){ state="pause"; show("pause"); }
  else if(state==="pause"){ state="play"; show(null); }
}
function toggleSound(){
  Snd.on = !Snd.on;
  document.getElementById("bSound").textContent = Snd.on ? "♪" : "✕";
}

/* ---------------- logika ---------------- */
function update(dt){
  tick += dt;
  if(state !== "play") return;
  levelTime += dt/60;

  // pohyblivé plošiny
  for(const p of level.platforms){
    if(!p.move) continue;
    const nx = p.move.axis==="x" ? p.ox + Math.sin(tick*p.move.sp)*p.move.range : p.ox;
    const ny = p.move.axis==="y" ? p.oy + Math.sin(tick*p.move.sp)*p.move.range : p.oy;
    p.dx = nx-p.x; p.dy = ny-p.y; p.x = nx; p.y = ny;
  }

  // časovače
  player.inv    = Math.max(0, player.inv-dt);
  player.atk    = Math.max(0, player.atk-dt);
  player.atkCd  = Math.max(0, player.atkCd-dt);
  player.coyote = Math.max(0, player.coyote-dt);
  player.buffer = Math.max(0, player.buffer-dt);
  player.squash += (1-player.squash)*.18*dt;

  // horizontální vstup
  const want = (keys.right?1:0) - (keys.left?1:0);
  if(want){
    player.vx += (want*player.speed - player.vx)*.28*dt;
    player.facing = want;
    player.walk += .22*dt;
  } else {
    player.vx *= Math.pow(.78, dt);
    if(Math.abs(player.vx) < .1) player.vx = 0;
  }

  // skok (buffer + coyote + proměnná výška)
  if(keys.up && !upPrev) player.buffer = 9;
  upPrev = keys.up;
  if(player.buffer>0 && (player.grounded || player.coyote>0)){
    player.vy = player.jump; player.grounded=false; player.coyote=0; player.buffer=0;
    player.ride=null; player.squash=1.35; Snd.jump();
    burst(player.x+player.w/2, player.y+player.h, 6, "#d9c9a3", 2);
  }
  if(!keys.up && player.vy < -4) player.vy = -4;

  // úder kyjem
  if(keys.atk && player.atkCd<=0){
    player.atk = 16; player.atkCd = 26; Snd.swing();
    const hx = player.facing===1 ? player.x+player.w-6 : player.x-44;
    const hb = { x:hx, y:player.y-6, w:52, h:54 };
    for(const en of level.enemies){
      if(en.dead || en.type==="plant") continue;
      if(hb.x < en.x+en.w && hb.x+hb.w > en.x && hb.y < en.y+en.h && hb.y+hb.h > en.y){
        en.dead = 1; score += 200; Snd.hit(); shake(7);
        burst(en.x+en.w/2, en.y+en.h/2, 16, "#b06fd8", 4);
        float(en.x+en.w/2, en.y, "+200");
      }
    }
    for(const tr of level.trees){
      if(tr.hit) continue;
      if(hb.x < tr.x+80 && hb.x+hb.w > tr.x-10 && hb.y < tr.y+210 && hb.y+hb.h > tr.y){
        tr.hit = true; tr.sh = 16; score += 100; Snd.hit(); shake(4);
        level.items.push({ x:tr.x+22, y:tr.y+90, w:26, h:24, type:Math.random()<.35?"egg":"meat", got:false, ph:0 });
        burst(tr.x+34, tr.y+55, 14, "#2fae63", 3);
        float(tr.x+30, tr.y+40, "+100", "#7ff0a8");
      }
    }
  }

  // fyzika
  player.vy = Math.min(MAXFALL, player.vy + GRAV*dt);
  const wasGrounded = player.grounded;

  // vodorovná kolize (jen pevná zem)
  player.x += player.vx*dt;
  for(const p of level.platforms){
    if(!p.solid) continue;
    if(player.x < p.x+p.w && player.x+player.w > p.x && player.y+player.h > p.y+6 && player.y < p.y+p.h){
      if(player.vx > 0) player.x = p.x - player.w;
      else if(player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // svislá kolize
  const prevBottom = player.y + player.h;
  player.y += player.vy*dt;
  player.grounded = false; player.ride = null;
  for(const p of level.platforms){
    if(player.x+8 > p.x+p.w || player.x+player.w-8 < p.x) continue;
    const bottom = player.y + player.h;
    if(player.vy >= 0 && bottom >= p.y && prevBottom <= p.y + 14 + player.vy){
      player.y = p.y - player.h; player.vy = 0; player.grounded = true;
      if(p.move) player.ride = p;
      if(!wasGrounded){ player.squash = .72; burst(player.x+player.w/2, player.y+player.h, 5, "#cbb894", 2); }
      if(p.kind === "ground"){ player.safeX = player.x; player.safeY = player.y-10; }
    } else if(p.solid && player.vy < 0 && player.y < p.y+p.h && player.y > p.y){
      player.y = p.y + p.h; player.vy = 1;
    }
  }
  if(player.grounded) player.coyote = 8; else if(wasGrounded) player.coyote = 8;
  if(player.ride){ player.x += player.ride.dx; player.y += player.ride.dy; }
  player.x = clamp(player.x, 0, level.width - player.w);
  if(player.blink > 0) player.blink -= dt; else if(Math.random() < .004*dt) player.blink = 8;

  // pád do propasti
  if(player.y > H + 60) damage(true);

  // nepřátelé
  for(const en of level.enemies){
    if(en.dead){ en.dead += dt; continue; }
    en.ph += dt*.12;
    if(en.type === "dino"){
      en.x += en.vx*dt;
      if(en.x < en.minX || en.x+en.w > en.maxX) en.vx *= -1;
    } else if(en.type === "ptero"){
      en.x += en.vx*dt;
      if(en.x < en.minX || en.x+en.w > en.maxX) en.vx *= -1;
      en.y = (en.type==="ptero" ? en.y : en.y);
    }
    const ey = en.type==="ptero" ? en.y + Math.sin(en.ph)*26 : (en.type==="plant" ? en.y - Math.abs(Math.sin(en.ph*.5))*26 : en.y);
    en.drawY = ey;

    const hitX = player.x+6 < en.x+en.w-6 && player.x+player.w-6 > en.x+6;
    const hitY = player.y+player.h > ey+4 && player.y < ey+en.h;
    if(!hitX || !hitY) continue;

    const stomp = en.type !== "plant" && player.vy > 1.5 && prevBottom <= ey + 18;
    if(stomp){
      en.dead = 1; score += 250; player.vy = -9.5; player.squash = 1.3;
      Snd.stomp(); shake(5);
      burst(en.x+en.w/2, ey+en.h/2, 14, "#b06fd8", 3.5);
      float(en.x+en.w/2, ey, "+250", "#ffd76e");
    } else {
      damage(false);
    }
  }

  // sběr
  for(const it of level.items){
    if(it.got) continue;
    it.ph += dt*.1;
    if(player.x < it.x+it.w && player.x+player.w > it.x && player.y < it.y+it.h && player.y+player.h > it.y){
      it.got = true;
      const val = it.type==="egg" ? 500 : (it.type==="fruit" ? 150 : 200);
      score += val; Snd.coin();
      burst(it.x+13, it.y+12, 10, it.type==="fruit" ? "#ffb03a" : "#ffe9a8", 2.5);
      float(it.x+13, it.y, "+"+val);
    }
  }

  // cíl
  if(player.x + player.w > level.goal + 20 && player.x < level.goal + 90 && player.y + player.h > 230){
    finishLevel();
  }

  // kamera
  const target = clamp(player.x - W/3, 0, Math.max(0, level.width - W));
  cam.x += (target - cam.x)*.12*dt;
  cam.shake *= Math.pow(.86, dt);

  // efekty
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; p.life -= dt;
    if(p.life <= 0) particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f = floats[i]; f.y -= .7*dt; f.life -= dt;
    if(f.life <= 0) floats.splice(i,1);
  }
}

function damage(fell){
  if(player.inv > 0 && !fell) return;
  lives--; player.inv = 95; Snd.hurt(); shake(10);
  burst(player.x+player.w/2, player.y+player.h/2, 14, "#ff6b4a", 3);
  if(fell){
    player.x = player.safeX; player.y = player.safeY; player.vx = 0; player.vy = 0;
  } else {
    player.vy = -6.5; player.vx = player.facing===1 ? -5 : 5;
  }
  if(lives <= 0){
    lives = 0; state = "over"; best = Math.max(best, score);
    document.getElementById("overInfo").innerHTML =
      `Skóre ${score}<br>Nejlepší ${best}<br>Došel jsi do úrovně ${levelIdx+1}: ${level.def.name}`;
    show("over"); Snd.over();
  }
}

function finishLevel(){
  const timeBonus = Math.max(0, 2000 - Math.floor(levelTime)*12);
  const lifeBonus = lives*300;
  score += timeBonus + lifeBonus;
  best = Math.max(best, score);
  state = "clear"; Snd.win();
  const last = levelIdx >= LEVELS.length-1;
  document.getElementById("clearTitle").textContent = last ? "DOŠEL JSI DOMŮ!" : "ÚROVEŇ SPLNĚNA";
  document.getElementById("clearInfo").innerHTML =
    `Čas ${levelTime.toFixed(1)} s → bonus ${timeBonus}<br>Životy ${lives} → bonus ${lifeBonus}<br>Skóre ${score}`;
  document.getElementById("bNext").textContent = last ? "Hrát znovu" : "Další úroveň";
  show("clear");
}

/* ---------------- kreslení ---------------- */
function px(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x,y,w,h); }

function drawSky(){
  const d = level.def;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, d.sky[0]); g.addColorStop(1, d.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // slunce
  ctx.fillStyle = "rgba(255,238,180,.85)";
  ctx.beginPath(); ctx.arc(660, 70, 34, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,238,180,.18)";
  ctx.beginPath(); ctx.arc(660, 70, 58, 0, 7); ctx.fill();

  // mraky
  ctx.fillStyle = "rgba(255,255,255,.55)";
  for(const c of level.clouds){
    const x = ((c.x - cam.x*.12) % (level.width+400) + level.width+400) % (level.width+400) - 200;
    if(x < -160 || x > W+160) continue;
    const s = c.s;
    ctx.beginPath();
    ctx.arc(x, c.y, 16*s, 0, 7); ctx.arc(x+20*s, c.y-8*s, 20*s, 0, 7); ctx.arc(x+44*s, c.y, 15*s, 0, 7);
    ctx.fill();
  }

  // vzdálené hory
  ctx.fillStyle = d.far;
  for(let i=-1;i<7;i++){
    const bx = i*420 - (cam.x*.22) % 420;
    ctx.beginPath(); ctx.moveTo(bx-110,342); ctx.lineTo(bx+130,96); ctx.lineTo(bx+360,342); ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,.30)";
  for(let i=-1;i<7;i++){
    const bx = i*420 - (cam.x*.22) % 420;
    ctx.beginPath(); ctx.moveTo(bx+92,168); ctx.lineTo(bx+130,96); ctx.lineTo(bx+170,168); ctx.fill();
  }

  // bližší kopce
  ctx.fillStyle = d.hill;
  for(let i=-1;i<9;i++){
    const bx = i*300 - (cam.x*.45) % 300;
    ctx.beginPath(); ctx.arc(bx+120, 372, 130, Math.PI, 0); ctx.fill();
  }
  ctx.fillStyle = d.fog; ctx.globalAlpha = .22;
  ctx.fillRect(0, 250, W, 100); ctx.globalAlpha = 1;
}

function drawTree(tr){
  const sway = Math.sin(tick*.03 + tr.x)*3 + (tr.sh>0 ? Math.sin(tick*.9)*tr.sh*.4 : 0);
  if(tr.sh > 0) tr.sh -= .4;
  const bx = tr.x + 20, by = tr.y + 60;
  px(bx, by, 22, 280-60, "#6b4526");
  px(bx+14, by, 8, 220, "#4d3018");
  for(let i=0;i<6;i++) px(bx, by+18+i*32, 22, 5, "#3f2712");

  ctx.save();
  ctx.translate(bx+11, by+4);
  ctx.rotate(sway*Math.PI/180);
  const c1 = tr.hit ? "#1d7a45" : "#27ae60", c2 = tr.hit ? "#14562f" : "#1e8449";
  for(let i=0;i<6;i++){
    const a = -Math.PI + i*(Math.PI/5);
    ctx.save(); ctx.rotate(a*.5 - .4);
    ctx.fillStyle = i%2 ? c1 : c2;
    ctx.beginPath(); ctx.ellipse(0, -26, 48, 15, -.5+i*.35, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = c2;
  ctx.beginPath(); ctx.arc(0,-18,17,0,7); ctx.fill();
  if(!tr.hit){
    ctx.fillStyle = "#8b5a2b";
    ctx.beginPath(); ctx.arc(-9,-8,6,0,7); ctx.arc(6,-6,6,0,7); ctx.fill();
  }
  ctx.restore();
}

function drawPlatform(p){
  if(p.kind === "ground"){
    px(p.x, p.y, p.w, 13, "#2fae63");
    px(p.x, p.y+11, p.w, 5, "#1d7a45");
    px(p.x, p.y+16, p.w, p.h-16, "#7a5230");
    ctx.fillStyle = "#5b3a1f";
    for(let gx=0; gx<p.w; gx+=44){
      if(p.x+gx < cam.x-60 || p.x+gx > cam.x+W+60) continue;
      ctx.fillRect(p.x+gx, p.y+24, 18, 9);
      ctx.fillRect(p.x+gx+26, p.y+42, 12, 7);
    }
    ctx.fillStyle = "#1d7a45";
    for(let gx=8; gx<p.w; gx+=70){
      if(p.x+gx < cam.x-60 || p.x+gx > cam.x+W+60) continue;
      ctx.fillRect(p.x+gx, p.y-6, 3, 7);
      ctx.fillRect(p.x+gx+6, p.y-9, 3, 10);
    }
  } else {
    px(p.x, p.y, p.w, p.h, "#6a7d92");
    px(p.x, p.y, p.w, 5, "#9db0c4");
    px(p.x+6, p.y+9, p.w-12, p.h-9, "#41536a");
    px(p.x, p.y+p.h-3, p.w, 3, "#2b3849");
    if(p.move){
      ctx.fillStyle = "#ffcf5c";
      ctx.fillRect(p.x+p.w/2-8, p.y-6, 16, 3);
    }
  }
}

function drawItem(it){
  const bob = Math.sin(it.ph)*3;
  const x = it.x, y = it.y + bob;
  if(it.type === "meat"){
    px(x+1, y+9, 24, 6, "#ecf0f1"); px(x-1, y+6, 6, 12, "#dfe6e9"); px(x+21, y+6, 6, 12, "#dfe6e9");
    ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.arc(x+13, y+12, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#e74c3c"; ctx.beginPath(); ctx.arc(x+11, y+10, 4, 0, 7); ctx.fill();
  } else if(it.type === "fruit"){
    ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.arc(x+12, y+13, 10, 0, 7); ctx.fill();
    ctx.fillStyle = "#f5b041"; ctx.beginPath(); ctx.arc(x+9, y+10, 4, 0, 7); ctx.fill();
    px(x+11, y+1, 3, 5, "#6b4526"); px(x+13, y+1, 8, 4, "#27ae60");
  } else {
    ctx.fillStyle = "#fff7e0"; ctx.beginPath(); ctx.ellipse(x+13, y+12, 10, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#d9c39a";
    ctx.beginPath(); ctx.arc(x+9, y+9, 3, 0, 7); ctx.arc(x+16, y+15, 3.5, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x+13, y+12, 14 + Math.sin(tick*.08)*2, 0, 7); ctx.stroke();
  }
}

function drawGoal(){
  const x = level.goal, y = 220;
  px(x-10, y-10, 110, 130, "#4b5666");
  px(x-10, y-10, 110, 8, "#79879b");
  ctx.fillStyle = "#151a22";
  ctx.beginPath(); ctx.moveTo(x+20, y+120); ctx.lineTo(x+20, y+50);
  ctx.quadraticCurveTo(x+45, y+8, x+70, y+50); ctx.lineTo(x+70, y+120); ctx.fill();
  // pochodně
  for(const tx of [x-2, x+84]){
    px(tx, y+30, 6, 40, "#6b4526");
    const f = Math.sin(tick*.25 + tx)*3;
    ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.arc(tx+3, y+24, 8+f*.3, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd76e"; ctx.beginPath(); ctx.arc(tx+3, y+24+f*.2, 4, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "#ffcf5c";
  ctx.font = 'bold 14px "Courier New",monospace';
  ctx.textAlign = "center";
  ctx.fillText("DOMOV", x+45, y-20 + Math.sin(tick*.06)*3);
  ctx.textAlign = "left";
}

function drawDino(en){
  const y = en.drawY ?? en.y;
  ctx.save();
  ctx.translate(en.x, y);
  if(en.vx < 0){ ctx.scale(-1,1); ctx.translate(-en.w, 0); }
  const step = Math.sin(tick*.22)*4;
  px(-6, 20, 14, 8, "#5b2c6f");                    // ocas
  px(-12, 22, 8, 5, "#5b2c6f");
  px(6, 14, 30, 22, "#7d3c98");                    // tělo
  px(10, 20, 16, 8, "#9b59b6");
  px(22, 2, 20, 16, "#7d3c98");                    // hlava
  px(38, 10, 10, 7, "#5b2c6f");                    // tlama
  px(39, 8, 3, 3, "#fff"); px(44, 8, 3, 3, "#fff");// zuby
  px(28, 5, 7, 6, "#f1c40f"); px(31, 7, 3, 3, "#000");
  ctx.fillStyle = "#e74c3c";                        // ostny
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(9+i*9, 14); ctx.lineTo(13+i*9, 4); ctx.lineTo(17+i*9, 14); ctx.fill();
  }
  px(9, 34, 9, 12+step, "#512e5f");
  px(24, 34, 9, 12-step, "#512e5f");
  px(9, 44+step, 13, 4, "#3d2247");
  px(24, 44-step, 13, 4, "#3d2247");
  ctx.restore();
}

function drawPtero(en){
  const y = en.drawY ?? en.y;
  ctx.save();
  ctx.translate(en.x, y);
  if(en.vx < 0){ ctx.scale(-1,1); ctx.translate(-en.w, 0); }
  const flap = Math.sin(tick*.3)*12;
  ctx.fillStyle = "#2e86c1";
  ctx.beginPath(); ctx.moveTo(20,12); ctx.lineTo(-6,12-flap); ctx.lineTo(16,22); ctx.fill();
  ctx.beginPath(); ctx.moveTo(24,12); ctx.lineTo(48,12-flap); ctx.lineTo(30,22); ctx.fill();
  px(14, 10, 20, 12, "#1f618d");
  px(30, 4, 12, 10, "#2e86c1");
  ctx.fillStyle = "#f39c12";
  ctx.beginPath(); ctx.moveTo(40,8); ctx.lineTo(56,12); ctx.lineTo(40,15); ctx.fill();
  px(33, 6, 4, 4, "#fff"); px(34, 7, 2, 2, "#000");
  ctx.fillStyle = "#154360";
  ctx.beginPath(); ctx.moveTo(30,4); ctx.lineTo(22,-4); ctx.lineTo(34,2); ctx.fill();
  ctx.restore();
}

function drawPlant(en){
  const y = en.drawY ?? en.y;
  const top = y;
  px(en.x+11, top+20, 9, 340-top-20, "#1e8449");
  for(let i=0;i<4;i++) px(en.x+4, top+40+i*26, 24, 5, "#166b39");
  ctx.fillStyle = "#c0392b";
  ctx.beginPath(); ctx.arc(en.x+15, top+16, 16, 0, 7); ctx.fill();
  const open = 4 + Math.abs(Math.sin(tick*.1))*6;
  ctx.fillStyle = "#7b241c";
  ctx.beginPath(); ctx.moveTo(en.x+15, top+16); ctx.lineTo(en.x+34, top+16-open); ctx.lineTo(en.x+34, top+16+open); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.moveTo(en.x+24, top+13-open*.5); ctx.lineTo(en.x+30, top+11-open*.5); ctx.lineTo(en.x+29, top+16); ctx.fill();
  ctx.fillStyle = "#f1c40f"; ctx.fillRect(en.x+9, top+8, 4, 4);
}

function drawHero(){
  if(player.inv > 0 && Math.floor(player.inv/5)%2 === 0) return;
  const sq = player.squash, w = player.w;
  ctx.save();
  ctx.translate(player.x + w/2, player.y + player.h);
  ctx.scale(1/sq, sq);
  ctx.translate(-w/2, -player.h);
  if(player.facing === -1){ ctx.scale(-1,1); ctx.translate(-w, 0); }

  const moving = Math.abs(player.vx) > .4 && player.grounded;
  const leg = moving ? Math.sin(player.walk)*5 : 0;

  px(7, 40, 9, 11+leg, "#c0392b");
  px(19, 40, 9, 11-leg, "#c0392b");
  px(5, 49+leg, 13, 4, "#8e2e21");
  px(17, 49-leg, 13, 4, "#8e2e21");

  px(5, 17, 25, 25, "#d35400");                     // kožešina
  px(5, 17, 25, 4, "#a04000");
  ctx.fillStyle = "#78281f";
  ctx.fillRect(9, 22, 6, 5); ctx.fillRect(19, 30, 7, 4); ctx.fillRect(11, 33, 4, 4);
  px(3, 20, 4, 16, "#e59866");                      // volná ruka

  px(7, 3, 21, 17, "#edbb99");                      // hlava
  px(24, 9, 7, 7, "#d98880");                       // nos
  px(11, 12, 17, 8, "#2c1e13");                     // vousy
  px(3, -1, 26, 7, "#2c1e13");                      // vlasy
  px(3, 5, 6, 9, "#2c1e13");
  px(19, 7, 4, player.blink>0 ? 1 : 4, "#000");     // oko
  px(6, 14, 3, 3, "#c0392b");                       // barva na tváři

  // kyj
  ctx.save();
  const swinging = player.atk > 0;
  const prog = swinging ? 1 - player.atk/16 : 0;
  if(swinging){
    ctx.translate(24, 26);
    ctx.rotate((-115 + prog*160) * Math.PI/180);
  } else {
    ctx.translate(22, 22);
    ctx.rotate((-135 + Math.sin(tick*.05)*4) * Math.PI/180);
  }
  px(0, -5, 26, 9, "#7a4a1e");
  px(0, -5, 26, 3, "#9c6431");
  px(22, -12, 16, 23, "#5b3a17");
  ctx.fillStyle = "#d9d0c0";
  ctx.fillRect(26, -10, 4, 4); ctx.fillRect(32, -2, 4, 4); ctx.fillRect(27, 4, 4, 4);
  ctx.restore();

  px(20, 20, 9, 9, "#e59866");                      // ruka s kyjem
  ctx.restore();

  if(swingTrail()) {}
  function swingTrail(){
    if(player.atk > 8){
      ctx.save();
      ctx.globalAlpha = (player.atk-8)/8*.5;
      ctx.strokeStyle = "#fff3cf"; ctx.lineWidth = 4;
      const cx = player.x + w/2 + player.facing*18, cy = player.y + 22;
      ctx.beginPath();
      ctx.arc(cx, cy, 34, player.facing===1?-1.5:1.5, player.facing===1?.6:Math.PI-0.6, player.facing===-1);
      ctx.stroke(); ctx.restore();
    }
    return false;
  }
}

function drawHud(){
  ctx.save();
  ctx.font = 'bold 18px "Courier New",monospace';
  ctx.textBaseline = "top";
  const txt = "SKÓRE " + String(score).padStart(6,"0");
  ctx.fillStyle = "#000"; ctx.fillText(txt, 15, 13);
  ctx.fillStyle = "#ffcf5c"; ctx.fillText(txt, 13, 11);

  for(let i=0;i<3;i++){
    const x = 15 + i*24, y = 36, on = i < lives;
    ctx.fillStyle = on ? "#e74c3c" : "rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.arc(x+5, y+5, 5, 0, 7); ctx.arc(x+13, y+5, 5, 0, 7);
    ctx.moveTo(x, y+7); ctx.lineTo(x+9, y+18); ctx.lineTo(x+18, y+7); ctx.fill();
  }

  const lt = `${levelIdx+1}/${LEVELS.length} ${level.def.name}`;
  ctx.font = 'bold 14px "Courier New",monospace';
  ctx.fillStyle = "#000"; ctx.fillText(lt, 15, 62);
  ctx.fillStyle = "#e8dcc6"; ctx.fillText(lt, 14, 61);

  // ukazatel postupu
  const bw = 150, bx = W-bw-70, by = 16;
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(bx, by, bw, 8);
  ctx.fillStyle = "#38c9a3";
  ctx.fillRect(bx, by, bw*clamp(player.x/level.goal,0,1), 8);
  ctx.fillStyle = "#ffcf5c";
  ctx.fillRect(bx+bw-2, by-3, 3, 14);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(!level){ ctx.fillStyle="#12202f"; ctx.fillRect(0,0,W,H); return; }

  drawSky();

  const sx = cam.shake ? rnd(-cam.shake,cam.shake) : 0;
  const sy = cam.shake ? rnd(-cam.shake,cam.shake) : 0;
  ctx.save();
  ctx.translate(-Math.round(cam.x) + sx, sy);

  const vis = o => o.x > cam.x-260 && o.x < cam.x+W+260;

  level.trees.forEach(t => { if(vis(t)) drawTree(t); });
  drawGoal();
  level.platforms.forEach(p => { if(p.x < cam.x+W+80 && p.x+p.w > cam.x-80) drawPlatform(p); });
  level.items.forEach(it => { if(!it.got && vis(it)) drawItem(it); });

  level.enemies.forEach(en => {
    if(en.dead || !vis(en)) return;
    if(en.type === "dino") drawDino(en);
    else if(en.type === "ptero") drawPtero(en);
    else drawPlant(en);
  });

  drawHero();

  for(const p of particles){
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  ctx.font = 'bold 15px "Courier New",monospace';
  ctx.textAlign = "center";
  for(const f of floats){
    ctx.globalAlpha = clamp(f.life/40,0,1);
    ctx.fillStyle = "#000"; ctx.fillText(f.txt, f.x+1, f.y+1);
    ctx.fillStyle = f.col;  ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = "left";

  ctx.restore();
  drawHud();

  if(state === "pause" || state === "clear" || state === "over"){
    ctx.fillStyle = "rgba(8,11,16,.35)";
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------------- smyčka ---------------- */
let last = performance.now();
function loop(now){
  const dt = clamp((now-last)/16.667, 0, 2.5);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

loadLevel(0);
requestAnimationFrame(loop);
addEventListener("blur", () => { if(state==="play") togglePause(); });
})();
</script>
</body>
</html>
